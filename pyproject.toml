[project]
name = "mathpaperlib"
version = "0.1.0"
description = "A library of papers for AI agents: find, download, name and search full texts (CLI and MCP server)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LeoLourson" }]
keywords = ["mcp", "literature", "arxiv", "zbmath", "mathnet", "agents", "pdf"]
dependencies = [
    "mcp>=1.2,<2",
    "numpy",
    "onnxruntime",
    "tokenizers",
    "huggingface_hub",
    "pymupdf",
    "certifi",
]

[project.urls]
Repository = "https://github.com/LeoLourson/MathPaperLib"

[project.scripts]
lit = "mathpaperlib.lit:main"
mathpaperlib = "mathpaperlib.lit:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathpaperlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
